<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
/>
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

    <title>Baby Steps</title>
</head>
<body>
    <div class="header-wrapper">
   
        <div class="user-info">
              <div class="avatar-container">
                    <img src="sun.png" alt="kawaii sun avatar" class="avatar"></img>
                </div>
                <p><strong>Greetings, user!</strong></p>
        </div>

        <div class="nav-buttons">
            <button class="menu-button" id="nav-addTask">Add Task</button>
        </div>
    
    </div>


    <div class="sidebar" id="sidebar">
        <nav id="nav">
             <div id="logo">     
                <i class="mdi mdi-sun"></i>
                <h1>Baby Steps To-Do</h1>
            </div>
        
   
    <div id="nav-desktop">
          
            <button class="menu-button" id="addTask">Add Task</button>
            <button class="menu-button" id="completed">Completed</button>
            <button class="menu-button" id="allTasks">All Tasks</button>
            <button class="menu-button" id="projects">Projects</button>
                
                    <button class="project-menu" id="default-project">Default</button>
                    <button class="project-menu" id="new-project">New Project</button>
        <div id="new-project-div">
            <form action="" id="new-project-form">
                <label for="projectFolderName">Project Folder Name 
                    <input type="text" name="projectFolderName" id="projectFolderName"/>
                </label>
            </form>
        </div>

         <div class="task" id="default-task-form">
                <h3>Task Title</h3>
                <form id="task-form" class="task-form">
                    <label for="taskTitle">Task Name
                        <input type="text" name="taskTitle" id="taskTitle"/>
                    </label>
                    <label for="taskNotes">Notes
                        <input type="text" name="taskNotes" id="taskNotes"/>
                    </label>
                    <label for="taskDueDate">Due Date
                        <input type="date" id="taskDueDate" name="taskDueDate" />
                    </label>
                    <label for="priorities">Set Priority
                        <select name="priorities" id="priorities">
                            <option value="high">High</option>
                            <option value="mid">Mid</option>
                            <option value="low">Low</option>
                        </select>
                    </label>
                    <label for="project-folders">Project Folder
                        <select name="project-folders" id="project-folders">
                            <option value="default">Default</option>
                        </select>
                    </label>
                    <input type="submit" class="submit-btn" id="submit-button" value="Add"/>
                </form>
               
            </div>
    </div>


    <button onclick="w3_open()" class="w3-button"> 
        <i class="mdi mdi-menu"></i>
    </button>
<div class="w3-animate-left" id="nav-mobile" style="display:none">
    <button onclick="w3_close()" class="w3-button w3-margin-top w3-border w3-medium">Close &times;</button>


        <ul>
            <li id="menu-item1">New Task</li>
            <li id="menu-item2">Completed</li>
            <li id="menu-item3">All Tasks</li>
            <li id="menu-item4">Projects
                <ul>
                    <li>Default</li>
                    <li>New Project</li>
                </ul>
            </li>
        </ul>
    </div>
    </nav>
    </div>
    <main>
        <div class="projects-tab" id="projects-tab">
            <h2 id="project-tab-name">Default</h2>
            <div class="grid" id="default-grid">
           
            </div>
        </div>
    
    </main>


    <footer><p>BY YESSI KENNEY &copy; 2026</p>
    <p>
    🧿
*.·.☽✧ 𖦹 ✧☾.·.*

₊˚⊹
   </p></footer>
</body>
<script>

   function w3_open() {
  document.getElementById("nav-mobile").style.display = "block";
}

function w3_close() {
  document.getElementById("nav-mobile").style.display = "none";
}
</script>
</html>
