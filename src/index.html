<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
/>
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

    <title>Baby Steps</title>
</head>
<body>
    <header>
        <div id="head-title">
        <h1>Baby Steps: A To Do List</h1>
        
         <div class="avatar-container">
            <img src="sun.png" alt="kawaii sun avatar" class="avatar"></img>
        </div> </div>
        <nav id="head-nav">
            <button id="head-task">Add Task</button>
            <button id="head-project">Add Project</button>
            <button id="head-all-tasks">View All Tasks</button>

        </nav>
        

                <button onclick="w3_open()" class="w3-button"> 
        <i class="mdi mdi-menu"></i>
    </button>
<div class="w3-animate-left" id="nav-mobile" style="display:none">
    <button onclick="w3_close()" class="w3-button w3-margin-top w3-border w3-medium">Close &times;</button>

    </header>



 <div class="sidebar" id="sidebar">
        



   
    <div id="nav-desktop">
          
            <button class="menu-button open-form-btn" data-target="#task-form" id="addTask">Add Task</button>
            <button class="menu-button" id="side-completed">Completed</button>
            <button class="menu-button" id="side-allTasks">All Tasks</button>
            <button class="menu-button" id="side-projects">Projects</button>
                   <button class="project-menu open-form-btn" id="new-project" data-target="#new-project-form">New Project</button>
                    <button class="project-buttons" id="default-project">Default</button>
                 
       
            <form id="new-project-form" hidden>
                <label for="folderNameForm">New Folder Name 
                    <input type="text" name="folderNameForm" id="folderNameForm"/>
                </label>
                <input type="submit" class="submit-btn" id="submit-folder" value="Enter"/>
            </form>
        </div>

         <div class="task" id="default-task-form">
                <h3>Task Title</h3>
                <form id="task-form" class="task-form" hidden>
                    <label for="taskTitle">Task Name
                        <input type="text" name="taskTitle" id="taskTitle"/>
                    </label>
                    <label for="taskNotes">Notes
                        <input type="text" name="taskNotes" id="taskNotes"/>
                    </label>
                    <label for="taskDueDate">Due Date
                        <input type="date" id="taskDueDate" name="taskDueDate" />
                    </label>
                    <label for="priorities">Set Priority
                        <select name="priorities" id="priorities">
                            <option value="high">High</option>
                            <option value="mid">Mid</option>
                            <option value="low">Low</option>
                        </select>
                    </label>
                    <label for="project-folders">Project Folder
                        <select name="project-folders" id="project-folders-drop">
                            <option value="default">Default</option>
                        </select>
                    </label>
                    <input type="submit" class="submit-btn" id="submit-task" value="Add"/>
                </form>
               
            </div>
    </div>

     
 
 <div class="projects-tab" id="projects-tab">
    <h2 id="project-tab-name">Default</h2>
        <div class="tasks-grid" id="tasks-grid"> 
        </div>
</div>
    



    <footer><p>BY YESSI KENNEY &copy; 2026</p>
    <p>

   </p></footer>
</body>
<script>

   function w3_open() {
  document.getElementById("nav-mobile").style.display = "block";
}

function w3_close() {
  document.getElementById("nav-mobile").style.display = "none";
}
</script>
</html>
